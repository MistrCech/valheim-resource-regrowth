# Thunderstore package of this plugin, built and published with `tcli` (github.com/thunderstore-io/thunderstore-cli):
#   tcli build                          builds dist/Sarkastic_gg-Resource_Regrowth-<version>.zip
#   tcli publish --token <token>        uploads it (the token is a service account token of the team)
# The version is the plugin's (RegrowthPlugin.cs); a package-only change (the icon) takes the next patch number.
# README.md carries a version badge: change it together with versionNumber.
[config]
schemaVersion = "0.0.1"

[package]
namespace = "Sarkastic_gg"
name = "Resource_Regrowth"
versionNumber = "0.8.4"
description = "Server-side BepInEx plugin for Valheim 1.0 servers: brings back surtling cores, chest loot, monsters, beehives, crypt iron, cave items, terrain and whole zones in areas left alone. Vanilla clients. Recommended with Dedicated_Simulation."
websiteUrl = "https://github.com/MistrCech/valheim-resource-regrowth"
containsNsfwContent = false

[package.dependencies]
denikson-BepInExPack_Valheim = "5.4.2351"

[build]
icon = "./icon.png"
readme = "./README.md"
outdir = "./dist"

[[build.copy]]
source = "./bin/Release/SarkasticGG_Resource_Regrowth.dll"
target = "plugins/"

[[build.copy]]
source = "./CHANGELOG.md"
target = "/"

[[build.copy]]
source = "./LICENSE"
target = "/"

[publish]
repository = "https://thunderstore.io"
communities = [ "valheim" ]

[publish.categories]
valheim = [ "server-side", "tweaks", "deep-north-update" ]
